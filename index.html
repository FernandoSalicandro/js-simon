Dopo che sono stati inseriti i 5 numeri, il software dice quanti e quali dei numeri da indovinare sono stati individuati.

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container my-3">
        <!-- QUI VA IL GENERATORE DEI 5 NUMERI -->
        <div>

            <!-- questo poi dovrà sparire dopo un tot -->
            <h2 id="random-numbers" class="my-3"></h2>
            <p>Inserisci tutti i numeri che ricordi (l'ordine non è importante)</p>
        </div>




        <!-- QUI VANNO GLI INPUT -->
        <form action="submit" id="numbers-form" class="flex my-3">
            <input type="number" class="memory-num" style="width: calc(100% / 5 - 30px);">
            <input type="number" class="memory-num" style="width: calc(100% / 5 - 30px);">
            <input type="number" class="memory-num" style="width: calc(100% / 5 - 30px);">
            <input type="number" class="memory-num" style="width: calc(100% / 5 - 30px);">
            <input type="number" class="memory-num" style="width: calc(100% / 5 - 30px);">

        </form>



        <!-- QUI VA IL BOTTONE -->
        <div class="flex justify-center simon">
            <button class="simon_btn mr-3" id="conferma-btn">Conferma</button>
            <button class="simon_btn bg-red" id="ricomincia">Ricomincia</button>
        </div>
        <!-- QUI VA IL MESSAGGIO -->
        <div class="flex">
            <h5 class="h5" id="messaggio-winlose"></h5>
        </div>


    </div>





    <script src="./js/script.js"></script>
